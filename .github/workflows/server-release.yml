name: Dedicated server release

on:
  push:
    tags:
      - 'server-v*'

permissions:
  contents: read

concurrency:
  group: server-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Validate source and independent release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 tools/server_release.py --tag "$RELEASE_TAG" --validate-only
          python3 tools/check_public_tree.py --ref HEAD
          python3 -m unittest discover -s tools/tests
      - name: Install pinned Godot 4.6.1
        run: python3 tools/install_server_toolchain.py
      - name: Build and accept asset-free server packages
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 tools/server_release.py --tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dedicated-server-release
          path: |
            outputs/server-release/Moonstone-Duel-Server-*-Linux.zip
            outputs/server-release/Moonstone-Duel-Server-*-Windows.zip
            outputs/server-release/duel-server-build-manifest.json
            outputs/server-release/duel-server-verification.json
            outputs/server-release/SHA256SUMS
            outputs/server-release/release-notes.md
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dedicated-server-release
          path: outputs/server-release
      - name: Publish the server tag without replacing the latest game release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          python3 tools/server_release.py --tag "$RELEASE_TAG" --validate-only
          cd outputs/server-release
          sha256sum --check SHA256SUMS
          version="${RELEASE_TAG#server-v}"
          extra=()
          if [[ "$version" == *-* ]]; then extra+=(--prerelease); fi
          gh release create "$RELEASE_TAG" --verify-tag --latest=false "${extra[@]}" \
            --title "Moonstone server $version" --notes-file release-notes.md \
            "Moonstone-Duel-Server-$version-Linux.zip" \
            "Moonstone-Duel-Server-$version-Windows.zip" \
            duel-server-build-manifest.json duel-server-verification.json SHA256SUMS
